<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thitouzg</title>
<meta name="description" content="Thitouzg — solo game dev.">
<meta name="theme-color" content="#020604">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020604;
  --g:#39ff7a; --g-rgb:57,255,122;
  --c:#00f0ff;
  --amber:#ffb13b;
  --txt:#c8ffd9;
  --dim:#4f8f63;
  --px:'Press Start 2P','Courier New',monospace;
  --mono:'VT323','Courier New',monospace;
  --mx:0; --my:0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:22px;line-height:1.15;min-height:100vh;min-height:100svh;overflow-x:hidden}
::selection{background:var(--g);color:#000}
a{color:inherit;text-decoration:none}
canvas,img{image-rendering:pixelated}
.glow{text-shadow:0 0 1px #fff,0 0 6px var(--c)}

/* ===== fond : motif Φ qui dérive + halo ===== */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{content:"";position:absolute;inset:-180px;background-image:var(--tile);background-size:180px 180px;opacity:.4;
  animation:drift 70s linear infinite;transform:translate(calc(var(--mx)*-8px),calc(var(--my)*-8px))}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 30%,rgba(var(--g-rgb),.09),transparent 70%)}
@keyframes drift{to{background-position:360px 360px}}

/* ===== CRT ===== */
.crt{position:fixed;inset:0;z-index:90;pointer-events:none}
.crt::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.crt::after{content:"";position:absolute;inset:0;border-radius:2.5%/1.5%;
  box-shadow:inset 0 0 90px 20px rgba(0,240,255,.06),inset 0 0 200px 70px rgba(0,0,0,.6)}
.noise{position:fixed;inset:-50%;z-index:89;pointer-events:none;opacity:.06;animation:noise .4s infinite steps(1);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='1' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.roll{position:fixed;left:0;right:0;top:-25vh;height:22vh;z-index:88;pointer-events:none;background:linear-gradient(transparent,rgba(var(--g-rgb),.045),transparent);animation:roll 8s linear infinite}
@keyframes noise{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
@keyframes roll{to{top:125vh}}

/* ===== allumage TV (une seule fois) ===== */
#boot{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;cursor:pointer}
#boot i{width:100%;height:3px;background:#fff;box-shadow:0 0 20px 6px #fff,0 0 60px 20px var(--c);transform:scaleX(0);animation:line .35s .15s ease-out forwards}
#boot.off{animation:bootoff .45s ease-in forwards}
@keyframes line{to{transform:scaleX(1)}}
@keyframes bootoff{0%{clip-path:inset(49.6% 0 49.6% 0)}100%{clip-path:inset(50% 0 50% 0);opacity:0;visibility:hidden}}
#site.on{animation:on .55s cubic-bezier(.2,.9,.2,1) both}
@keyframes on{0%{transform:scaleY(.005);filter:brightness(6)}60%{filter:brightness(1.6)}100%{transform:none;filter:none}}

/* ===== layout ===== */
#site{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(14px,2.2vh,26px) clamp(14px,3vw,40px) 18px;gap:clamp(16px,2.6vh,30px)}

/* ===== carte d'identité ===== */
.card{position:relative;width:min(1100px,100%);display:flex;align-items:center;gap:clamp(20px,4vw,48px);padding:clamp(20px,3vh,34px) clamp(20px,3vw,40px);
  background:linear-gradient(180deg,rgba(3,18,9,.9),rgba(2,9,5,.92));border-top:2px solid var(--g);border-bottom:2px solid var(--g);
  box-shadow:0 0 30px rgba(var(--g-rgb),.15),inset 0 0 40px rgba(var(--g-rgb),.06);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.id{flex:1;min-width:0}
.logo{position:relative;display:inline-block;font-family:var(--px);font-weight:400;font-size:clamp(28px,4.6vw,58px);line-height:1.1;color:var(--g);white-space:nowrap;
  text-shadow:0 0 1px #fff,0 0 10px rgba(var(--g-rgb),.9),0 0 38px rgba(var(--g-rgb),.45)}
.logo::before,.logo::after{content:attr(data-t);position:absolute;inset:0;opacity:0;text-shadow:none;mix-blend-mode:screen}
.logo::before{color:#ff2e6a}.logo::after{color:var(--c)}
.logo.glitch::before{opacity:.85;animation:g1 .3s steps(2) 1}.logo.glitch::after{opacity:.85;animation:g2 .3s steps(2) 1}
@keyframes g1{0%{transform:translate(-4px,2px);clip-path:inset(12% 0 58% 0)}50%{transform:translate(5px,-2px);clip-path:inset(56% 0 10% 0)}100%{transform:none;clip-path:inset(0)}}
@keyframes g2{0%{transform:translate(4px,-2px);clip-path:inset(60% 0 8% 0)}50%{transform:translate(-5px,2px);clip-path:inset(8% 0 62% 0)}100%{transform:none;clip-path:inset(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.tag{margin:12px 0 20px;font-family:var(--px);font-size:clamp(10px,1.1vw,13px);letter-spacing:.12em;color:var(--c);text-shadow:0 0 6px var(--c)}
.tag i{display:inline-block;width:.7em;height:1.05em;background:var(--c);vertical-align:-.2em;margin-left:4px;animation:cur 1s steps(1) infinite;box-shadow:0 0 6px var(--c)}
@media(max-width:720px){.card{flex-direction:column;text-align:center;-webkit-mask-image:none;mask-image:none;border:1px solid rgba(var(--g-rgb),.4)}.links{justify-content:center}}

main{width:min(1100px,100%);display:flex;flex-direction:column;gap:30px}
.a-works{grid-area:works}.a-game{grid-area:game;display:flex;align-items:center}
.a-game{justify-content:center}.a-game .tv{width:100%;max-width:900px;margin-top:6px}

/* ===== panneaux ===== */
.panel{position:relative;padding:24px 18px 18px;background:linear-gradient(180deg,rgba(3,18,9,.88),rgba(2,9,5,.9));
  border:1px solid rgba(var(--g-rgb),.38);box-shadow:0 0 26px rgba(var(--g-rgb),.1),inset 0 0 30px rgba(var(--g-rgb),.05);
}
.rv{opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1)}
#site.on .rv{opacity:1;transform:none;transition-delay:var(--d,0s)}
.panel::before{content:"";position:absolute;inset:-1px;pointer-events:none;
  background:
   linear-gradient(var(--g),var(--g)) 0 0/14px 2px no-repeat,linear-gradient(var(--g),var(--g)) 0 0/2px 14px no-repeat,
   linear-gradient(var(--g),var(--g)) 100% 0/14px 2px no-repeat,linear-gradient(var(--g),var(--g)) 100% 0/2px 14px no-repeat,
   linear-gradient(var(--g),var(--g)) 0 100%/14px 2px no-repeat,linear-gradient(var(--g),var(--g)) 0 100%/2px 14px no-repeat,
   linear-gradient(var(--g),var(--g)) 100% 100%/14px 2px no-repeat,linear-gradient(var(--g),var(--g)) 100% 100%/2px 14px no-repeat;
  filter:drop-shadow(0 0 4px var(--g))}
.label{position:absolute;top:-8px;left:14px;padding:0 8px;background:var(--bg);font-family:var(--px);font-size:9px;letter-spacing:.06em;color:var(--g);text-shadow:0 0 6px rgba(var(--g-rgb),.8);line-height:16px}
.label em{font-style:normal;color:var(--dim)}

/* ===== profil ===== */
.prof{display:flex;align-items:center;gap:16px}
.pp{flex:none;position:relative;width:clamp(120px,14vw,170px);height:clamp(120px,14vw,170px);cursor:pointer;-webkit-tap-highlight-color:transparent;margin:18px}
.pp #viz{position:absolute;left:50%;top:50%;width:170%;height:170%;transform:translate(-50%,-50%);pointer-events:none}
.pp #pp{position:relative;width:100%;height:100%;border-radius:50%;display:block;box-shadow:0 0 0 2px var(--g),0 0 18px rgba(var(--g-rgb),.5);transition:transform .08s}
.pp.kick #pp{transform:scale(1.05)}
.pp::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 4px)}
.who h1{font-family:var(--px);font-weight:400;font-size:13px;color:#fff;margin-bottom:10px}
.who p{font-family:var(--px);font-size:9px;color:var(--c);letter-spacing:.06em;line-height:1.6}
.who p i{display:inline-block;width:.7em;height:1.05em;background:var(--c);vertical-align:-.2em;margin-left:3px;animation:cur 1s steps(1) infinite;box-shadow:0 0 6px var(--c)}
.status{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:18px;color:var(--dim)}
.led{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);animation:blink 2.2s infinite}
@keyframes cur{50%{opacity:0}}
@keyframes blink{0%,88%,100%{opacity:1}94%{opacity:.25}}

/* ===== liens ===== */
.links{display:flex;flex-wrap:wrap;gap:10px}
.lk{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;font-family:var(--px);font-size:9px;letter-spacing:.04em;
  color:var(--g);border:1px solid rgba(var(--g-rgb),.45);background:rgba(var(--g-rgb),.04);overflow:hidden;transition:color .15s,box-shadow .15s,border-color .15s}
.lk::before{content:"";position:absolute;inset:0;background:var(--g);transform:scaleX(0);transform-origin:left;transition:transform .2s steps(6);z-index:0}
.lk>*{position:relative;z-index:1}
.lk:hover{color:#001a08;border-color:var(--g);box-shadow:0 0 18px rgba(var(--g-rgb),.55)}
.lk:hover::before{transform:none}
.lk:hover span{text-shadow:-2px 0 #ff2e6a88,2px 0 #00f0ff88}
.lk.kofi{padding:11px 14px;font-size:9px;color:var(--amber);border-color:rgba(255,177,59,.6);background:rgba(255,177,59,.06);box-shadow:0 0 16px rgba(255,177,59,.15)}
.lk.kofi::before{background:var(--amber)}
.lk.kofi:hover{color:#1d1000;box-shadow:0 0 26px rgba(255,177,59,.6)}
.lk.kofi b{animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}}

/* ===== works ===== */
.works{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.wip{flex-direction:column;justify-content:center;text-align:center}
.wip canvas{width:100%;height:auto;aspect-ratio:4/3;max-width:160px}
@media(max-width:720px){.works{grid-template-columns:1fr}.wip{flex-direction:row;text-align:left}.wip canvas{width:72px}}
.pt{display:block;position:relative;padding:16px 14px;border:1px solid rgba(255,213,74,.45);background:linear-gradient(160deg,#211a4d,#120d2c 70%);
  box-shadow:0 0 0 1px #000,0 8px 22px rgba(0,0,0,.5);transition:transform .15s,box-shadow .2s;overflow:hidden}
.pt::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%);transform:translateX(-100%);transition:transform .6s}
.pt:hover{transform:translateY(-3px);box-shadow:0 0 0 1px #000,0 0 26px rgba(255,213,74,.35),0 12px 28px rgba(0,0,0,.55)}
.pt:hover::after{transform:translateX(100%)}
.pt-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.emblem{width:48px;height:48px;flex:none;filter:drop-shadow(0 0 8px rgba(255,77,94,.5));animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.wordmark{font-family:'Pixelify Sans',var(--px);font-weight:700;font-size:30px;line-height:1;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.45)}
.wordmark b{color:#ffd54a;font-weight:700}
.pt p{color:#d8d2ff;font-size:20px;margin-bottom:14px}
.play{display:inline-flex;align-items:center;gap:8px;font-family:var(--px);font-size:10px;color:#1a1200;background:#ffd54a;padding:10px 14px;box-shadow:0 4px 0 #a8801a}
.pt:hover .play{background:#fff;box-shadow:0 4px 0 #b9b9b9}
.pt:active .play{transform:translateY(3px);box-shadow:0 1px 0 #a8801a}
.wip{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed rgba(var(--g-rgb),.35)}
.wip canvas{width:72px;height:54px;flex:none;border:1px solid rgba(var(--g-rgb),.4);background:#000}
.wip .q{flex:1;font-family:var(--px);font-size:14px;color:var(--txt);letter-spacing:.2em;opacity:.8}
.badge{font-family:var(--px);font-size:8px;padding:5px 7px;background:var(--amber);color:#1d1000;animation:blink 1.6s infinite}

/* ===== TV du jeu ===== */
.tv{position:relative;padding:16px 16px 12px;border-radius:24px;background:linear-gradient(180deg,#1b211d,#0c100e);
  box-shadow:inset 0 2px 0 #2f3832,inset 0 -3px 0 #040605,0 24px 50px rgba(0,0,0,.65),0 0 50px rgba(var(--g-rgb),.08)}
.tv-label{position:absolute;top:-8px;left:26px;font-family:var(--px);font-size:9px;color:var(--g);background:var(--bg);padding:0 8px;line-height:16px;text-shadow:0 0 6px rgba(var(--g-rgb),.8)}
.screen{position:relative;border-radius:18px/24px;overflow:hidden;background:#000;line-height:0;box-shadow:0 0 0 3px #050706,0 0 0 5px #2a322d}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 30% 15%,rgba(255,255,255,.08),transparent 45%),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55));
  box-shadow:inset 0 0 40px rgba(0,240,255,.12)}
#game{display:block;width:100%;height:auto;cursor:pointer;touch-action:manipulation}
.tv-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:0 6px;font-family:var(--px);font-size:8px;color:#5d6b62}
.tv-bar .ch{display:flex;align-items:center;gap:8px;color:var(--g)}
.knobs{display:flex;gap:10px}
.knobs i{width:18px;height:18px;border-radius:50%;background:conic-gradient(#3a443e,#141a16,#3a443e,#141a16,#3a443e);box-shadow:inset 0 0 0 2px #0a0d0b,0 1px 0 #2f3832}
.hud{color:var(--txt)}

footer{font-family:var(--px);font-size:8px;color:var(--dim);letter-spacing:.14em}

@media(max-width:720px){body{font-size:20px}.hero{height:150px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div><div class="noise"></div><div class="roll"></div><div class="crt"></div>
<div id="boot"><i></i></div>

<div id="site">
  <header class="card rv" style="--d:.05s">
    <div class="pp" id="ppwrap" title="clique !"><canvas id="viz" width="320" height="320"></canvas><canvas id="pp" width="96" height="96" aria-label="Photo de profil"></canvas></div>
    <div class="id">
      <h1 class="logo" id="logo" data-t="THITOUZG">THITOUZG</h1>
      <p class="tag">SOLO GAME DEV<i></i></p>
      <nav class="links" id="links" aria-label="Mes liens"></nav>
    </div>
  </header>

  <main>
    <section class="panel rv a-works" style="--d:.15s">
      <span class="label">MY WORKS</span>
      <div class="works">
        <a class="pt" id="pt" target="_blank" rel="noopener">
          <div class="pt-top"><svg class="emblem" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="#1a1630" d="M7 0h2v1h-2zM5 1h2v1h-2zM9 1h2v1h-2zM3 2h2v1h-2zM11 2h2v1h-2zM1 3h2v1h-2zM13 3h2v1h-2zM0 4h1v1h-1zM15 4h1v1h-1zM0 5h1v1h-1zM15 5h1v1h-1zM0 6h1v1h-1zM6 6h4v1h-4zM15 6h1v1h-1zM0 7h7v1h-7zM9 7h7v1h-7zM0 8h7v1h-7zM9 8h7v1h-7zM0 9h1v1h-1zM6 9h4v1h-4zM15 9h1v1h-1zM0 10h1v1h-1zM15 10h1v1h-1zM0 11h1v1h-1zM15 11h1v1h-1zM1 12h2v1h-2zM13 12h2v1h-2zM3 13h2v1h-2zM11 13h2v1h-2zM5 14h2v1h-2zM9 14h2v1h-2zM7 15h2v1h-2z"/><path fill="#ff4d5e" d="M7 1h2v1h-2zM5 2h6v1h-6zM3 3h2v1h-2zM6 3h7v1h-7zM1 4h2v1h-2zM4 4h11v1h-11zM1 5h14v1h-14zM1 6h5v1h-5zM10 6h5v1h-5z"/><path fill="#f6f3ff" d="M5 3h1v1h-1zM3 4h1v1h-1zM7 7h2v1h-2zM7 8h2v1h-2zM1 9h5v1h-5zM10 9h5v1h-5zM1 10h14v1h-14zM1 11h14v1h-14zM3 12h10v1h-10zM5 13h6v1h-6zM7 14h2v1h-2z"/></svg><span class="wordmark">Poké<b>Tactics</b></span></div>
          <p>Auto battler PvP façon TFT, directement dans ton navigateur.</p>
          <span class="play">JOUER ▶</span>
        </a>
        <div class="wip"><canvas id="static" width="48" height="36"></canvas><span class="q">???</span><span class="badge">WIP</span></div>
      </div>
    </section>

    <section class="a-game">
      <div class="tv rv" style="--d:.25s">
        <span class="tv-label">ESCAPE FROM THE LAB</span>
        <div class="screen"><canvas id="game" width="800" height="400" aria-label="Mini-jeu Escape from the Lab"></canvas></div>
        <div class="tv-bar">
          <span class="ch"><span class="led"></span><span id="deaths">MORTS 000</span></span>
          <span class="hud" id="hud">HI 00000</span>
          <span class="knobs"><i></i><i></i></span>
        </div>
      </div>
    </section>
  </main>

  <footer>© THITOUZG</footer>
</div>

<script>
/* ============ À MODIFIER ICI ============ */
const LINKS = [
  { label: 'KO-FI', icon: '♥', url: 'https://ko-fi.com/thitouzg', kofi: true },
  { label: 'X',       icon: '↗', url: 'https://x.com/thitouzg' },
  { label: 'TIKTOK',  icon: '↗', url: 'https://www.tiktok.com/@thitouzg' },
  { label: 'MAIL',    icon: '✉', url: 'mailto:thitouzg@gmail.com' }

/* ---------- égaliseur autour de la pp : clique = ça cogne ---------- */
(function () {
  const wrap = $('#ppwrap'), c = $('#viz'), g = c.getContext('2d'), N = 56, S = c.width, C = S / 2;
  const bars = new Float32Array(N); let energy = .25, rings = [], ac = null, last = performance.now();
  function kick() {
    energy = Math.min(2.2, energy + .9); rings.push({ r: 0, a: 1 });
    wrap.classList.add('kick'); setTimeout(() => wrap.classList.remove('kick'), 90);
    try {                                                     // petit blip 8-bit : une note au hasard de la gamme
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
      const f = SCALE[Math.random() * SCALE.length | 0], t = ac.currentTime;
      const o = ac.createOscillator(), v = ac.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(f, t);                       // arpège sec façon chiptune
      o.frequency.setValueAtTime(f * 1.5, t + .045);
      o.frequency.setValueAtTime(f * 2, t + .09);
      v.gain.setValueAtTime(.09, t); v.gain.setValueAtTime(.06, t + .09); v.gain.setValueAtTime(0, t + .16);
      o.connect(v).connect(ac.destination); o.start(t); o.stop(t + .17);
    } catch (e) {}
  }
  wrap.addEventListener('pointerdown', kick);
  (function frame(ts) {
    const dt = Math.min(3, (ts - last) / 16.67); last = ts;
    energy += (.4 - energy) * .035 * dt;
    const beat = .5 + .5 * Math.sin(ts / 260) * Math.sin(ts / 1130);
    g.clearRect(0, 0, S, S);
    const r0 = S * .3;
    for (let i = 0; i < N; i++) {
      const target = (.15 + .85 * Math.abs(Math.sin(ts / (180 + i * 7) + i * 1.7)) * (.4 + beat * .6)) * energy;
      bars[i] += (target - bars[i]) * .25 * dt;
      const ang = i / N * Math.PI * 2 - Math.PI / 2, len = 4 + bars[i] * S * .08;
      const x1 = C + Math.cos(ang) * (r0 + 3), y1 = C + Math.sin(ang) * (r0 + 3);
      const x2 = C + Math.cos(ang) * (r0 + 3 + len), y2 = C + Math.sin(ang) * (r0 + 3 + len);
      g.strokeStyle = bars[i] > .9 ? '#00f0ff' : '#39ff7a'; g.lineWidth = 4; g.lineCap = 'butt';
      g.shadowColor = g.strokeStyle; g.shadowBlur = 8;
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    }
    g.shadowBlur = 0;
    rings = rings.filter(r => (r.r += 2.2 * dt, r.a -= .022 * dt) > 0);
    rings.forEach(r => { g.strokeStyle = `rgba(57,255,122,${r.a})`; g.lineWidth = 2; g.beginPath(); g.arc(C, C, r0 + r.r, 0, Math.PI * 2); g.stroke(); });
    requestAnimationFrame(frame);
  })(last);
})();

/* ============ MINI-JEU : ESCAPE FROM THE LAB ============ */
(function () {
  const cv = $('#game'), g = cv.getContext('2d'), hud = $('#hud'), deathsEl = $('#deaths');
  g.imageSmoothingEnabled = false;
  const W = 800, H = 400, GROUND = 350;
  const A = new Image(); let ready = false; A.onload = () => { ready = true; draw(); }; A.src = ATLAS.img;
  const FR = ATLAS.f;

  /* dessine la frame i de l'anim n (flip = regarde à gauche) */
  function spr(n, i, x, y, flip, sub, sc = 1) {
    const f = FR[n][i % FR[n].length];
    const [sx, sy, sw, sh] = sub ? [f[0] + sub[0], f[1] + sub[1], sub[2], sub[3]] : f;
    const dw = sw * sc, dh = sh * sc;
    if (!flip) { g.drawImage(A, sx, sy, sw, sh, Math.round(x), Math.round(y), dw, dh); return; }
    g.save(); g.translate(Math.round(x) + dw, Math.round(y)); g.scale(-1, 1); g.drawImage(A, sx, sy, sw, sh, 0, 0, dw, dh); g.restore();
  }
  const fi = (ms, n, off = 0) => Math.floor((now + off) / ms) % n;   // index de frame basé sur le temps (vitesse fixe)

  /* ---- ennemis : taille de dessin, hitbox (dans la frame) ---- */
  const KIND = {
    short: { w: 64, h: 64, hb: [10, 18, 44, 44], walk: .9 },
    fly:   { w: 64, h: 64, hb: [10, 18, 44, 28], walk: 0 },
    tall:  { w: 64, h: 128, hb: [12, 16, 40, 108], walk: .7 },
    gros:  { w: 256, h: 128, hb: [64, 24, 136, 100], walk: 0 },      // dessiné en x2, arrive par derrière
    laser: { w: 64, h: 64, hb: [12, 24, 42, 38], walk: 0 }            // arrive par derrière aussi
  };

  let state = 'idle', now = 0, t = 0, dist = 0, speed, score, coins, hi = 0, deaths = 0;
  let obs, plats, dots, fx, nextAt, visible = false, running = false, deadAt = 0, shake = 0, buffer = 0, coyote = 0, held = false, last = 0;
  const pl = { x: 190, y: 0, vy: 0, ground: true, plat: null };
  let death = null, pending = null;   // animation de mort / attaque par derrière en attente
  try { hi = +localStorage.getItem('tz_hi') || 0; deaths = +localStorage.getItem('tz_deaths') || 0; } catch (e) {}
  const pad = (n, k = 5) => String(Math.floor(n)).padStart(k, '0');
  const setHud = () => { hud.textContent = 'HI ' + pad(hi); deathsEl.textContent = 'MORTS ' + pad(deaths, 3); };
  setHud();

  function reset() {
    speed = 5.5; score = 0; coins = 0; dist = 0; obs = []; plats = []; dots = []; fx = []; nextAt = 500; shake = 0; death = null; pending = null;
    pl.y = GROUND - 64; pl.vy = 0; pl.ground = true; pl.plat = null;
  }
  reset();

  /* ---- contrôles ---- */
  function press() {
    if (state === 'idle') { state = 'run'; reset(); }
    else if (state === 'dead') { if (performance.now() - deadAt > 500) { state = 'run'; reset(); } return; }
    else if (state !== 'run') return;
    buffer = 8;
  }
  const KEYS = ['Space', 'ArrowUp', 'KeyW'];
  addEventListener('keydown', e => {
    if (!visible) return;
    if (KEYS.includes(e.code)) { e.preventDefault(); held = true; if (!e.repeat) press(); }
    if (e.code === 'KeyR' && state === 'dead') press();
  });
  addEventListener('keyup', e => { if (KEYS.includes(e.code)) held = false; });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); held = true; press(); });
  addEventListener('pointerup', () => held = false);
  addEventListener('pointercancel', () => held = false);

  /* ---- génération ---- */
  function addEnemy(type) {
    const k = KIND[type], chaser = type === 'laser' || type === 'gros';
    obs.push({ type, x: chaser ? -k.w - 10 : W + 20, y: type === 'fly' ? GROUND - 128 : GROUND - k.h, ...k, ph: Math.random() * 1000,
      mode: chaser ? 'warn' : 'walk', timer: 0, arm: 0 });
  }
  function addDots(x, y, n, arc) {
    for (let i = 0; i < n; i++) dots.push({ x: x + i * 30, y: arc ? y - Math.sin(i / (n - 1) * Math.PI) * 60 : y, got: false });
  }
  const CHASERS = ['laser', 'gros'];
  function spawn() {
    const r = Math.random(), lvl = Math.min(1, dist / 9000);
    let room = 360;
    // un laser ou un gros est en train d'arriver / attaquer : rien d'autre ne vient de droite, juste des pièces
    if (pending) {                                   // attaque par derrière en attente : plus rien ne vient de droite
      if (obs.some(o => !CHASERS.includes(o.type) && o.x + o.w > pl.x - 10)) { nextAt = dist + 60; return; }
      addEnemy(pending); pending = null; nextAt = dist + 200; return;
    }
    if (obs.some(o => CHASERS.includes(o.type) && o.mode !== 'leave')) {
      addDots(W + 20, GROUND - 30, 4, false); nextAt = dist + 260; return;
    }
    if (r < .18) {                                                      // plateforme + pièces dessus
      const w = 140 + Math.random() * 80, y = Math.random() < .5 ? GROUND - 110 : GROUND - 165;
      plats.push({ x: W + 20, y, w });
      addDots(W + 40, y - 26, Math.floor(w / 34), false);
      if (Math.random() < .5 && dist > 1500) { addEnemy('short'); obs[obs.length - 1].x += w * .6; }
      room = w + 260;
    } else if (r < .3) {                                                // juste des pièces
      addDots(W + 20, GROUND - 30, 4 + (Math.random() * 3 | 0), Math.random() < .4);
      room = 280;
    } else {
      const pool = ['short', 'short'];
      if (dist > 1200) pool.push('fly');
      if (dist > 2500) pool.push('laser');
      if (dist > 3500) pool.push('tall');
      if (dist > 5000) pool.push('gros');
      const type = pool[Math.random() * pool.length | 0];
      if (CHASERS.includes(type)) { pending = type; nextAt = dist + 60; return; }   // il attendra que la voie soit libre
      addEnemy(type);
      if (type !== 'fly' && Math.random() < .45) addDots(W + 20, GROUND - 165, 3, true);   // pièces en arc au-dessus
      room = { short: 330, fly: 340, laser: 620, tall: 470, gros: 820 }[type];
    }
    nextAt = dist + room * (1.15 - lvl * .25) + Math.random() * 140;
  }

  /* ---- mort ---- */
  function die() {
    state = 'dying'; shake = 16; deadAt = performance.now();
    death = { t: 0, hx: pl.x, hy: pl.y - 7, hvx: -2.5, hvy: -9, rot: 0, by: pl.y };
    fx.push({ kind: 'boom', x: pl.x, y: pl.y - 4, t: 0 });
    deaths++; score = Math.floor(score);
    if (score > hi) hi = score;
    try { localStorage.setItem('tz_hi', hi); localStorage.setItem('tz_deaths', deaths); } catch (e) {}
    setHud();
  }

  /* ---- update ---- */
  const hit = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  function step(dt) {
    t += dt;
    if (shake) { shake *= .86; if (shake < .5) shake = 0; }
    fx.forEach(f => f.t += dt); fx = fx.filter(f => f.t < (f.kind === 'boom' ? 24 : 30));

    if (state === 'dying') {
      const d = death; d.t += dt;
      d.hvy += .5 * dt; d.hx += d.hvx * dt; d.hy += d.hvy * dt; d.rot -= .12 * dt;
      if (d.hy > GROUND - 40) { d.hy = GROUND - 40; d.hvy *= -.35; d.hvx *= .6; }
      if (d.t > 70) { state = 'dead'; deadAt = performance.now(); }
      return;
    }
    if (state !== 'run') return;

    speed = Math.min(10.5, 5.5 + dist / 2500);
    dist += speed * dt; score += speed * dt * .08;

    // saut (maintenir = plus haut)
    if (buffer > 0) buffer -= dt;
    if (pl.ground) coyote = 6; else if (coyote > 0) coyote -= dt;
    if (buffer > 0 && coyote > 0) { pl.vy = -12.6; pl.ground = false; pl.plat = null; buffer = 0; coyote = 0; }
    const prevBottom = pl.y + 64;
    pl.vy += (held && pl.vy < 0 ? .45 : .8) * dt; pl.y += pl.vy * dt;
    pl.ground = false;
    if (pl.y >= GROUND - 64) { if (pl.vy > 4) puff(); pl.y = GROUND - 64; pl.vy = 0; pl.ground = true; }
    for (const p of plats) {                                   // plateformes : on traverse par dessous, on atterrit dessus
      if (pl.vy >= 0 && prevBottom <= p.y + 2 && pl.y + 64 >= p.y && pl.x + 40 > p.x && pl.x + 22 < p.x + p.w) {
        if (pl.vy > 4) puff(); pl.y = p.y - 64; pl.vy = 0; pl.ground = true;
      }
    }

    // monde
    plats.forEach(p => p.x -= speed * dt); plats = plats.filter(p => p.x + p.w > -20);
    dots.forEach(d => d.x -= speed * dt); dots = dots.filter(d => d.x > -20 && !d.got);
    for (const o of obs) {
      if (o.mode === 'walk') { o.x -= (speed - o.walk) * dt; continue; }   // ils marchent dans ton sens, tu les rattrapes
      // laser & gros : arrivent par la gauche, attaquent vers l'avant, repartent
      o.timer += dt;
      const home = o.type === 'gros' ? -30 : 40;
      if (o.mode === 'warn' && o.timer > 50) { o.mode = 'enter'; o.timer = 0; }
      else if (o.mode === 'enter') { o.x = Math.min(home, o.x + 5 * dt); if (o.x >= home) { o.mode = 'charge'; o.timer = 0; } }
      else if (o.mode === 'charge' && o.timer > (o.type === 'gros' ? 40 : 46)) { o.mode = 'fire'; o.timer = 0; shake = Math.max(shake, o.type === 'gros' ? 10 : 4); }
      else if (o.mode === 'fire') {
        if (o.type === 'gros') o.arm = o.timer < 6 ? o.timer / 6 : o.timer < 22 ? 1 : Math.max(0, 1 - (o.timer - 22) / 10);
        if (o.timer > (o.type === 'gros' ? 32 : 22)) { o.mode = 'leave'; o.timer = 0; o.arm = 0; }
      }
      else if (o.mode === 'leave') o.x -= 4 * dt;
    }
    obs = obs.filter(o => o.mode === 'warn' || o.mode === 'enter' || o.x + o.w > -30);
    if (dist >= nextAt) spawn();

    // pièces
    for (const d of dots) if (!d.got && hit(pl.x + 14, pl.y + 10, 36, 50, d.x - 6, d.y - 6, 12, 12)) {
      d.got = true; coins++; score += 10; fx.push({ kind: 'spark', x: d.x, y: d.y, t: 0 });
    }

    // collisions
    const px = pl.x + 20, py = pl.y + 16, pw = 24, ph = 42;
    for (const o of obs) {
      if (o.mode === 'warn') continue;
      const [hx, hy, hw, hh] = o.hb;
      if (hit(px, py, pw, ph, o.x + hx, o.y + hy + (o.type === 'fly' ? Math.sin((now + o.ph) / 300) * 4 : 0), hw, hh)) { die(); return; }
      if (o.type === 'laser' && o.mode === 'fire' && hit(px, py, pw, ph, o.x + 56, GROUND - 26, W, 8)) { die(); return; }
      if (o.type === 'gros' && o.arm > 0) { const a = armRect(o); if (hit(px, py, pw, ph, a.x, a.y, a.w, a.h)) { die(); return; } }
    }
  }
  function puff() { for (let i = 0; i < 5; i++) fx.push({ kind: 'dust', x: pl.x + 22 + Math.random() * 20, y: pl.y + 60, vx: (Math.random() - .5) * 2.4, vy: -Math.random() * 1.5, t: 0 }); }

  /* ---- rendu ---- */
  function scene() {
    g.fillStyle = '#081014'; g.fillRect(0, 0, W, GROUND);
    // carrelage
    g.fillStyle = '#0d1b21'; const a = (dist * .25) % 64;
    for (let x = -a; x < W; x += 64) g.fillRect(Math.round(x), 0, 2, GROUND);
    for (let y = 46; y < GROUND; y += 64) g.fillRect(0, y, W, 2);
    // cuves
    const b = (dist * .5) % 280;
    for (let x = -b - 40; x < W + 280; x += 280) {
      const X = Math.round(x);
      g.fillStyle = '#0c242a'; g.fillRect(X, 80, 58, 200);
      g.fillStyle = '#0d5e3b'; g.fillRect(X + 6, 120, 46, 154);
      g.fillStyle = '#20c47a'; g.fillRect(X + 6, 120, 46, 4);
      g.fillStyle = '#8dffc6';
      for (let i = 0; i < 3; i++) g.fillRect(X + 13 + i * 14, 264 - ((t * 1.1 + i * 41 + X) % 130 + 130) % 130, 4, 4);
      g.fillStyle = '#1b444c'; g.fillRect(X - 4, 74, 66, 8); g.fillRect(X - 4, 276, 66, 8);
    }
    // plafond + tuyaux
    g.fillStyle = '#0f1c22'; g.fillRect(0, 0, W, 36); g.fillStyle = '#1b3640'; g.fillRect(0, 36, W, 3);
    g.fillStyle = '#22404b'; g.fillRect(0, 12, W, 8);
    const c = (dist * .6) % 120; g.fillStyle = '#33596a';
    for (let x = -c; x < W; x += 120) g.fillRect(Math.round(x), 8, 10, 16);
    // alarme
    const on = Math.floor(t / 22) % 2;
    g.fillStyle = on ? '#ff3c5c' : '#4a141c'; if (on) { g.shadowColor = '#ff3c5c'; g.shadowBlur = 22; }
    g.fillRect(W - 44, 40, 18, 10); g.shadowBlur = 0;
    // sol
    g.fillStyle = '#141f24'; g.fillRect(0, GROUND, W, H - GROUND);
    g.fillStyle = '#39ff7a'; g.fillRect(0, GROUND, W, 2);
    g.fillStyle = '#1d2c32'; for (let x = -((dist) % 160); x < W; x += 160) { g.fillRect(Math.round(x), GROUND + 2, 4, H - GROUND); g.fillRect(Math.round(x) + 40, GROUND + 22, 10, 4); }
  }


  function text(s, x, y, size, align, col) {
    g.font = size + "px 'Press Start 2P', monospace"; g.textAlign = align || 'center';
    g.fillStyle = '#000'; g.fillText(s, x + 2, y + 2); g.fillStyle = col || '#fff'; g.fillText(s, x, y);
  }
  function drawPlayer() {
    let body = 'p_run', bi = fi(85, 7), face = 6, bob = 0;
    if (state === 'idle') { body = 'p_idle'; bi = fi(420, 2); bob = bi; face = Math.floor(now / 2600) % 6 === 5 ? 2 : 6; }
    else if (!pl.ground) { if (pl.vy < 0) { body = 'p_jump'; bi = pl.vy < -7 ? 1 : 2; face = 4; } else { body = 'p_fall'; bi = fi(110, 3); face = 5; } }
    else bob = bi % 2;
    const x = pl.x, y = Math.round(pl.y);
    spr(body, bi, x, y, false);
    spr('head', 0, x, y - 7 + bob, false);
    spr('face', face, x + 24, y - 7 + bob + 20, false, [23, 20, 30, 24]);
  }
  function armRect(o) {                     // bras du gros : part de sa main et va vers la droite
    const x0 = o.x + 200, reach = Math.max(0, (pl.x + 150 - x0)) * o.arm;
    return { x: x0, y: GROUND - 66, w: reach + 90, h: 66 };
  }
  function drawEnemy(o) {
    const off = o.ph;
    if (o.mode === 'warn') {                  // alerte : il arrive par derrière
      if (Math.floor(now / 160) % 2) { text('!', 26, GROUND - (o.type === 'gros' ? 70 : 30), 28, 'center', '#ff3c5c'); }
      return;
    }
    if (o.type === 'short') {           // le petit : pas de planche, on le fait sautiller
      const b = fi(220, 2, off);
      spr('short', 0, o.x, o.y - b * 2, false);
    } else if (o.type === 'fly') spr('fly', 0, o.x, o.y + Math.sin((now + off) / 300) * 4, false);
    else if (o.type === 'tall') spr('tall', fi(190, 4, off), o.x, o.y, true);
    else if (o.type === 'gros') {
      if (o.mode === 'charge') spr('gros_wind', Math.min(3, Math.floor(o.timer / 10)), o.x, o.y, false, null, 2);
      else if (o.mode === 'fire') {
        spr('gros_wind', 3, o.x, o.y, false, null, 2);
        const a = armRect(o), n = Math.ceil(a.w / 32);
        for (let i = 0; i < n; i++) spr('gros_piston', 0, a.x + i * 30, GROUND - 52, false, null, 2);
        spr('gros_fist', 0, a.x + a.w - 90, GROUND - 66, false, null, 2);
      } else spr('gros', fi(230, 4, off), o.x, o.y, false, null, 2);
    }
    else if (o.type === 'laser') {
      const bx = o.x + 56;
      if (o.mode === 'charge') {
        spr('laser_charge', Math.min(5, Math.floor(o.timer / 8)), o.x, o.y, false);
        if (Math.floor(now / 90) % 2) { g.fillStyle = 'rgba(255,60,92,.55)'; for (let x = bx; x < W; x += 16) g.fillRect(x, GROUND - 23, 6, 2); }
      } else if (o.mode === 'fire') {
        spr('laser_charge', 5, o.x, o.y, false);
        const k = 1 - o.timer / 22;
        g.fillStyle = `rgba(255,60,92,${.35 * k})`; g.fillRect(bx, GROUND - 32, W, 20);
        g.fillStyle = '#ff3c5c'; g.fillRect(bx, GROUND - 26, W, 8);
        g.fillStyle = '#ffd0da'; g.fillRect(bx, GROUND - 24, W, 4);
      } else spr('laser_walk', fi(170, 4, off), o.x, o.y, false);
    }
  }
  function drawPlat(p) {
    const x = Math.round(p.x), y = p.y;
    g.fillStyle = '#1b3640'; g.fillRect(x + 12, 36, 3, y - 36); g.fillRect(x + p.w - 15, 36, 3, y - 36);   // câbles
    g.fillStyle = '#16262c'; g.fillRect(x, y, p.w, 14);
    g.fillStyle = '#2a4651'; g.fillRect(x, y, p.w, 4);
    g.fillStyle = '#39ff7a'; g.fillRect(x, y, p.w, 2);
    g.fillStyle = '#0b161a'; for (let i = 8; i < p.w - 6; i += 16) g.fillRect(x + i, y + 7, 8, 3);
  }
  function drawDot(d) {
    const p = 1 + Math.sin((now + d.x * 7) / 160) * .5;
    g.fillStyle = 'rgba(57,255,122,.25)'; g.fillRect(Math.round(d.x - 7), Math.round(d.y - 7), 14, 14);
    g.fillStyle = '#39ff7a'; g.shadowColor = '#39ff7a'; g.shadowBlur = 8 * p;
    g.fillRect(Math.round(d.x - 4), Math.round(d.y - 4), 8, 8); g.shadowBlur = 0;
    g.fillStyle = '#d6ffe3'; g.fillRect(Math.round(d.x - 2), Math.round(d.y - 2), 2, 2);
  }
  function drawDeath() {
    const d = death;
    spr('p_hurt', 0, pl.x, d.by, false);                                  // corps qui reste au sol
    g.save(); g.translate(Math.round(d.hx) + 34, Math.round(d.hy) + 32); g.rotate(d.rot);    // la tête qui saute
    spr('head', 0, -34, -32, false); spr('face', 3, -10, -12, false, [23, 20, 30, 24]);
    g.restore();
  }
  function draw() {
    g.save();
    if (shake) g.translate((Math.random() - .5) * shake | 0, (Math.random() - .5) * shake | 0);
    scene();
    if (ready) {
      plats.forEach(drawPlat);
      dots.forEach(drawDot);
      obs.forEach(drawEnemy);
      if (state === 'dying' || state === 'dead') drawDeath(); else drawPlayer();
      fx.forEach(f => {
        if (f.kind === 'boom') spr('boom', Math.min(2, Math.floor(f.t / 8)), f.x, f.y, false);
        else if (f.kind === 'spark') { g.fillStyle = `rgba(214,255,227,${1 - f.t / 30})`; const r = 4 + f.t * .6; g.fillRect(f.x - r, f.y - 1, r * 2, 2); g.fillRect(f.x - 1, f.y - r, 2, r * 2); }
        else { g.fillStyle = `rgba(150,180,170,${1 - f.t / 30})`; g.fillRect(f.x + f.vx * f.t, f.y + f.vy * f.t, 4, 4); }
      });
    }
    g.restore();
    text('SCORE ' + pad(score), 18, 30, 14, 'left');
    g.fillStyle = '#39ff7a'; g.fillRect(W - 128, 18, 10, 10); text(pad(coins, 3), W - 18, 30, 14, 'right', '#c8ffd9');
    if (state === 'idle') {
      text('ESCAPE FROM THE LAB', W / 2, 130, 24, 'center', '#39ff7a');
      if (Math.floor(now / 500) % 2) text('ESPACE / TAP POUR JOUER', W / 2, 172, 12);
      text('MAINTIENS POUR SAUTER PLUS HAUT', W / 2, 202, 10, 'center', '#8fb3bd');
    }
    if (state === 'dead') { text('GAME OVER', W / 2, 150, 30, 'center', '#ff3c5c'); text('ESPACE / R / TAP : REJOUER', W / 2, 190, 12); }
  }

  function loop() {
    if (running) return; running = true; last = performance.now();
    (function f(ts) {
      if (!visible) { running = false; return; }
      const dt = Math.min(2.5, (ts - last) / 16.67); last = ts; now = ts;
      step(dt); draw(); requestAnimationFrame(f);
    })(last);
  }
  new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible) loop(); }, { threshold: .3 }).observe(cv);
  if (document.fonts) document.fonts.load("14px 'Press Start 2P'").then(draw);
})();
</script>
</body>
